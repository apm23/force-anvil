name: build-and-runtime-verify
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Compile and package
        run: gradle build --stacktrace

      - name: Select runtime jar
        shell: bash
        run: |
          RUNTIME_JAR=$(find build/libs -maxdepth 1 -type f -name 'force-anvil-*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$RUNTIME_JAR"
          echo "RUNTIME_JAR=$RUNTIME_JAR" >> "$GITHUB_ENV"
          echo "Selected runtime jar: $RUNTIME_JAR"

      - name: Verify runtime jar contents
        shell: bash
        run: |
          jar tf "$RUNTIME_JAR" | tee jar-contents.txt
          grep -q '^fabric.mod.json$' jar-contents.txt
          grep -q '^forceanvil.mixins.json$' jar-contents.txt
          grep -q '^com/anjas/forceanvil/ForceAnvilMod.class$' jar-contents.txt
          grep -q '^com/anjas/forceanvil/mixin/ForceAnvilMenuMixin.class$' jar-contents.txt
          grep -q '^data/minecraft/tags/block/anvil.json$' jar-contents.txt
          if grep -q '^com/anjas/forceanvil/mixin/ForceAnvilMenuMixin.java$' jar-contents.txt; then
            echo 'ERROR: sources jar selected as runtime jar'
            exit 1
          fi

      - name: Development server startup smoke test
        shell: bash
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 90s gradle runServer --args='nogui' > server-smoke.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 90); do
            if grep -qE 'Done \([0-9.]+s\)!|Done \(' server-smoke.log; then
              OK=1
              break
            fi
            if grep -qE 'Mixin apply failed|MixinTransformerError|InvalidMixinException|ClassNotFoundException|Exception in thread|Failed to start|Could not execute entrypoint|Caused by:' server-smoke.log; then
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          cat server-smoke.log
          if [ "$OK" -ne 1 ]; then
            echo 'Development server did not reach successful startup.'
            exit 1
          fi

      - name: Stage runtime jar only
        shell: bash
        run: |
          mkdir -p artifact
          cp "$RUNTIME_JAR" artifact/
          ls -l artifact

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: force-anvil-runtime-verified
          path: artifact/*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-verification-logs
          path: |
            server-smoke.log
            jar-contents.txt
